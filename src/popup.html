<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Aloud</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4V5z"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
          </svg>
        </span>
        <div class="titles">
          <h1>Read Aloud</h1>
          <p id="source-label">Ready when you are</p>
        </div>
      </div>
      <span id="status-dot" class="dot idle" title="Idle"></span>
    </header>

    <section class="progress" aria-live="polite">
      <div class="bar"><div id="progress-fill" class="bar-fill"></div></div>
      <div class="progress-row">
        <span id="progress-text">Nothing playing</span>
        <span id="progress-count"></span>
      </div>
    </section>

    <section class="transport" aria-label="Playback controls">
      <button id="play" class="btn primary" title="Read selected text or the page (Ctrl+Shift+Y)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        Play
      </button>
      <button id="pause" class="btn" title="Pause reading">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
        Pause
      </button>
      <button id="resume" class="btn" title="Resume reading">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        Resume
      </button>
      <button id="stop" class="btn ghost" title="Stop and clear highlight">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg>
        Stop
      </button>
    </section>

    <section class="controls" aria-label="Voice settings">
      <label class="control">
        <span class="control-label">Speed <output id="rate-out">1.0×</output></span>
        <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">
      </label>
      <label class="control">
        <span class="control-label">Pitch <output id="pitch-out">1.0</output></span>
        <input id="pitch" type="range" min="0" max="2" step="0.1" value="1">
      </label>
      <label class="control">
        <span class="control-label">Voice</span>
        <select id="voice">
          <option value="">System default</option>
        </select>
      </label>
      <label class="control">
        <span class="control-label">Engine <output id="engine-active">Checking…</output></span>
        <select id="engine">
          <option value="auto">Auto — system, then bundled</option>
          <option value="system">System voices</option>
          <option value="bundled">Bundled neural (Piper)</option>
        </select>
      </label>
    </section>

    <p id="hint" class="hint">Select text to read just that, or press Play for the whole page.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
